name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Analyse Java
    runs-on: [self-hosted, replaycore, miami-ci]
    timeout-minutes: 25
    env:
      HOME: /srv/replaycore-miami/rc-miami-ci/repository-homes/sdk
      TMPDIR: /srv/replaycore-miami/rc-miami-ci/repository-homes/sdk/tmp
      XDG_CACHE_HOME: /srv/replaycore-miami/rc-miami-ci/repository-homes/sdk/.cache
      GRADLE_USER_HOME: /srv/replaycore-miami/rc-miami-ci/repository-homes/sdk/.gradle
      NPM_CONFIG_CACHE: /srv/replaycore-miami/rc-miami-ci/repository-homes/sdk/.cache/npm
      DOCKER_HOST: ""
      DBUS_SESSION_BUS_ADDRESS: ""

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Java 8
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true

      - name: Initialise CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Compile
        run: bash ./gradlew --no-daemon --no-build-cache --rerun-tasks clean classes

      - name: Analyse
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: /language:java-kotlin
