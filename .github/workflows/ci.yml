name: Java SDK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: [self-hosted, linux, x64, replaycore-java-sdk]
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          # pom.xml is the single source of the version; build.gradle reads it too.
          # Hardcoding it here made the artifact checks fail on every release commit.
          version="$(grep -m1 -oP '(?<=<version>)[^<]+' pom.xml)"
          test -n "$version"
          echo "SDK_VERSION=$version" >> "$GITHUB_ENV"
          echo "Resolved SDK version: $version"

      - name: Set up Java 8
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build with Gradle
        run: bash ./gradlew --no-daemon clean build

      - name: Verify Gradle artifact
        shell: bash
        run: |
          set -euo pipefail
          jar_path="build/libs/replaycore-java-sdk-${SDK_VERSION}.jar"
          test -s "$jar_path"
          major="$(javap -verbose -classpath "$jar_path" uk.co.forgevector.replaycore.api.client.ReplayCoreClient | awk '/major version:/ {print $3}')"
          test "$major" = "52"
          unzip -p "$jar_path" META-INF/MANIFEST.MF | grep -Fqx "$(printf 'Implementation-Version: %s\r' "$SDK_VERSION")"

      - name: Set up Java 17 for Maven release checks
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install checksum-pinned Maven
        shell: bash
        run: |
          set -euo pipefail
          if command -v mvn >/dev/null 2>&1; then
            mvn -version
            exit 0
          fi
          version='3.9.16'
          sha512='831A8591FE20C8243B1DBE7D71E3244F31D1665B0804B2E825E38CBBE5CE0CAFB8338851F90780735568773E0A6CD07BBEC107CDA0B896B008B861075358B6F6'
          tools="${RUNNER_TEMP}/apache-maven-${version}"
          archive="${RUNNER_TEMP}/apache-maven-${version}-bin.tar.gz"
          if [[ ! -x "${tools}/bin/mvn" ]]; then
            curl --fail --location --silent --show-error --retry 5 \
              --output "$archive" \
              "https://archive.apache.org/dist/maven/maven-3/${version}/binaries/apache-maven-${version}-bin.tar.gz"
            printf '%s  %s\n' "$sha512" "$archive" | sha512sum --check --strict
            mkdir -p "$RUNNER_TEMP"
            tar -xzf "$archive" -C "$RUNNER_TEMP"
          fi
          echo "MAVEN_HOME=${tools}" >> "$GITHUB_ENV"
          echo "${tools}/bin" >> "$GITHUB_PATH"

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Verify Maven artifact and build parity
        shell: bash
        run: |
          set -euo pipefail
          gradle_jar="build/libs/replaycore-java-sdk-${SDK_VERSION}.jar"
          maven_jar="target/replaycore-java-sdk-${SDK_VERSION}.jar"
          test -s "$maven_jar"
          major="$(javap -verbose -classpath "$maven_jar" uk.co.forgevector.replaycore.api.client.ReplayCoreClient | awk '/major version:/ {print $3}')"
          test "$major" = "52"
          unzip -p "$maven_jar" META-INF/MANIFEST.MF | grep -Fqx "$(printf 'Implementation-Version: %s\r' "$SDK_VERSION")"
          jar tf "$gradle_jar" | grep '\.class$' | LC_ALL=C sort > /tmp/gradle-classes.txt
          jar tf "$maven_jar" | grep '\.class$' | LC_ALL=C sort > /tmp/maven-classes.txt
          diff -u /tmp/gradle-classes.txt /tmp/maven-classes.txt

      - name: Check source headers
        shell: bash
        run: |
          set -euo pipefail
          missing="$(find src -type f -name '*.java' -exec grep -L 'Copyright (c) ForgeVector Software Limited' {} +)"
          test -z "$missing" || { printf 'Missing source headers:\n%s\n' "$missing" >&2; exit 1; }
