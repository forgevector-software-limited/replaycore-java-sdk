plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'uk.co.forgevector'
def releasePom = new XmlSlurper(false, false).parse(file('pom.xml'))
version = releasePom.version.text()
description = 'Official Java SDK for the ReplayCore developer API.'

def junitVersion = releasePom.properties.'junit.version'.text()
def junitPlatformVersion = releasePom.properties.'junit.platform.version'.text()

java {
    // The Minecraft plugin ecosystem still ships servers on Java 8, so the SDK
    // compiles to Java 8 bytecode. A toolchain pins the compiler regardless of
    // the JDK running Gradle; if no Java 8 toolchain is installed Gradle will
    // provision or locate one.
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // The runtime SDK has zero third-party dependencies: it uses only the JDK.
    // Test dependencies are not shipped.
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitPlatformVersion}"
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'replaycore.sdk.version', project.version.toString()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.named('jar') {
    manifest {
        attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'ForgeVector Software Limited')
    }
}

tasks.register('verifyReleaseMetadata') {
    group = 'verification'
    description = 'Checks that public dependency examples and runtime metadata match the release version.'
    inputs.files('pom.xml', 'README.md', 'docs/api-reference.md', 'docs/plugin-extensions.md',
            'src/main/java/uk/co/forgevector/replaycore/api/client/ReplayCoreClientBuilder.java')

    doLast {
        String expected = project.version.toString()
        String readme = file('README.md').getText('UTF-8')
        String apiReference = file('docs/api-reference.md').getText('UTF-8')
        String pluginExtensions = file('docs/plugin-extensions.md').getText('UTF-8')
        String builder = file('src/main/java/uk/co/forgevector/replaycore/api/client/ReplayCoreClientBuilder.java')
                .getText('UTF-8')

        def gradleCoordinate = (readme =~ /replaycore-java-sdk:v([0-9]+\.[0-9]+\.[0-9]+)/)
        def mavenCoordinate = (readme =~ /<version>v([0-9]+\.[0-9]+\.[0-9]+)<\/version>/)
        if (!gradleCoordinate.find() || !mavenCoordinate.find()) {
            throw new GradleException('README must contain both Gradle and Maven release coordinates')
        }
        String documentedRelease = gradleCoordinate.group(1)
        if (mavenCoordinate.group(1) != documentedRelease) {
            throw new GradleException('README Gradle and Maven release coordinates disagree')
        }
        if (!expected.endsWith('-SNAPSHOT') && documentedRelease != expected) {
            throw new GradleException("README release coordinate is not ${expected}")
        }
        if (!readme.contains("`${expected}`") || !apiReference.contains("`${expected}`")) {
            throw new GradleException("Public source documentation does not identify version ${expected}")
        }
        if (!pluginExtensions.contains("replaycore-java-sdk:v${expected}")) {
            throw new GradleException("Plugin compile-only coordinate is not ${expected}")
        }
        if (!builder.contains("SDK_VERSION = \"${expected}\"")) {
            throw new GradleException("Runtime SDK version does not match pom.xml (${expected})")
        }
    }
}

tasks.register('verifyNoRuntimeDependencies') {
    group = 'verification'
    description = 'Prevents third-party libraries from leaking into the published runtime contract.'

    doLast {
        def dependencies = configurations.runtimeClasspath.allDependencies
        if (!dependencies.empty) {
            throw new GradleException("Runtime dependencies are not allowed: ${dependencies}")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyReleaseMetadata')
    dependsOn tasks.named('verifyNoRuntimeDependencies')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xpkginfo:always'
    // Treat warnings as errors to keep the public surface clean, but silence the
    // benign "source/target 8 is obsolete" notice a newer toolchain JDK emits.
    options.compilerArgs << '-Xlint:all' << '-Xlint:-options' << '-Werror'
}

javadoc {
    options.encoding = 'UTF-8'
    options.author = true
    options.windowTitle = 'ReplayCore Java SDK'
    options.docTitle = 'ReplayCore Java SDK ' + version
    options.bottom = 'Copyright &copy; ForgeVector Software Limited. All rights reserved.'
    // Internal helpers are not part of the published surface.
    exclude 'uk/co/forgevector/replaycore/api/internal/**'
    // Keep every doclint group EXCEPT accessibility. The accessibility check enforces HTML heading order,
    // and the Java 8 javadoc tool used here and the Java 17 tool used by the Maven verify build disagree on
    // it: Java 8 accepts an <h2> section heading inside a member comment and rejects <h4> as a level skip,
    // while Java 17 rejects <h2>/<h3> there and wants <h4>. No single heading level satisfies both, so a
    // faithful mirror of the source cannot pass both with this group on. Dropping only accessibility keeps
    // the reference, syntax, html and missing checks that catch real defects (a bad {@link} target, broken
    // HTML) while letting the canonical heading style through.
    options.addStringOption('Xdoclint:all,-accessibility', '-quiet')
    // No -html5 option: the javadoc task runs under the pinned Java 8 toolchain above, whose javadoc
    // tool does not support -html5 (Java 8 emits HTML4, which is fine for an SDK). The old guard keyed
    // -html5 off JavaVersion.current() - the JDK running Gradle, which on any modern build machine is
    // 17/21 and Java-9-compatible - so the option was passed to the Java 8 tool and broke javadocJar,
    // and therefore publish, everywhere. Dropping it is the lowest-risk fix and needs no extra toolchain.
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'replaycore-java-sdk'
            pom {
                name = 'ReplayCore Java SDK'
                description = project.description
                url = 'https://replaycore.com'
                licenses {
                    license {
                        name = 'ForgeVector Software Limited Proprietary License'
                    }
                }
                developers {
                    developer {
                        name = 'William Bowyer'
                        organization = 'ForgeVector Software Limited'
                    }
                }
            }
        }
    }
}
