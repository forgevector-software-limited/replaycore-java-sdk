name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Review dependency changes
    runs-on: [self-hosted, replaycore, miami-ci]
    timeout-minutes: 10
    env:
      HOME: /srv/replaycore-miami/rc-miami-ci/repository-homes/sdk
      TMPDIR: /srv/replaycore-miami/rc-miami-ci/repository-homes/sdk/tmp
      XDG_CACHE_HOME: /srv/replaycore-miami/rc-miami-ci/repository-homes/sdk/.cache
      GRADLE_USER_HOME: /srv/replaycore-miami/rc-miami-ci/repository-homes/sdk/.gradle
      NPM_CONFIG_CACHE: /srv/replaycore-miami/rc-miami-ci/repository-homes/sdk/.cache/npm
      DOCKER_HOST: ""
      DBUS_SESSION_BUS_ADDRESS: ""

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never
